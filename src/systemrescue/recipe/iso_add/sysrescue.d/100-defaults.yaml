---
global:
  checksum: true
  copytoram: true
  dostartx: false
  dovnc: false
  noautologin: true
  nofirewall: false
  rootcryptpass: "!"
  setkmap: "us"

autorun:
  ar_disable: true

sysconfig:
  timezone: "UTC"
